<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MegaScierie | Programme Annuel</title>
<style>
  :root {
    --primary: #006d3b;
    --secondary: #00a86b;
    --light: #f5f8f6;
    --white: #fff;
    --dark: #222;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body { display: flex; background: var(--light); color: var(--dark); min-height: 100vh; }

  /* --- Sidebar --- */
  nav {
    width: 250px;
    background: var(--primary);
    color: var(--white);
    padding: 1.5rem 1rem;
    display: flex;
    flex-direction: column;
  }
  nav h2 { text-align: center; margin-bottom: 1.5rem; }
  nav a {
    color: var(--white);
    text-decoration: none;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    margin-bottom: 0.3rem;
    display: block;
    transition: 0.3s;
  }
  nav a:hover, nav a.active { background: var(--secondary); }

  /* --- Main --- */
  main { flex: 1; padding: 2rem; overflow-y: auto; }
  header {
    background: var(--white);
    padding: 1rem 2rem;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 1.5rem;
  }
  header h1 { color: var(--primary); }
  .user { color: var(--primary); font-weight: bold; }

  /* --- Card --- */
  .card {
    background: var(--white);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    margin-bottom: 2rem;
  }
  .card h2 {
    color: var(--primary);
    border-bottom: 2px solid var(--secondary);
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
  }

  /* --- Tableau --- */
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { border: 1px solid #ddd; padding: 0.8rem; text-align: left; }
  th { background: var(--primary); color: var(--white); }
  tr:nth-child(even) { background: var(--light); }
  .no-data { text-align: center; color: #777; font-style: italic; padding: 1rem 0; }

  .btn {
    display: inline-block;
    background: var(--primary);
    color: var(--white);
    padding: 0.7rem 1.2rem;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 1rem;
    transition: 0.3s;
  }
  .btn:hover { background: var(--secondary); }
</style>
</head>
<body>

<nav>
  <h2>🪵 MegaScierie</h2>
  <a href="contrats.html">📜 Contrats</a>
  <a href="programme_annuel.html" class="active">📅 Programme</a>
  <a href="declarations.html">🧾 Déclarations</a>
</nav>

<main>
  <header>
    <h1>📅 Programme Annuel de Production</h1>
    <p class="user">👤 Administrateur</p>
  </header>

  <div class="card">
    <h2>🗂️ Liste des Programmes</h2>
    <p>Voici les programmes annuels enregistrés dans le système MegaScierie.</p>

    <table>
      <thead>
        <tr>
          <th>Année</th>
          <th>Mois</th>
          <th>Produit</th>
          <th>Volume Prévu (m³)</th>
          <th>Responsable</th>
          <th>Statut</th>
        </tr>
      </thead>
      <tbody id="programme-data">
        <!-- Les lignes seront injectées depuis programme_annuel.php -->
      </tbody>
    </table>
  </div>
</main>

<!-- Script pour charger les données depuis PHP -->
<script>
  fetch('programme_annuel.php')
    .then(response => response.text())
    .then(data => document.getElementById('programme-data').innerHTML = data)
    .catch(error => console.error('Erreur :', error));
</script>

</body>
</html>
